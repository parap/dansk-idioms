<VirtualHost *:80>
    ServerName dansk.local
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The service worker itself must never be served stale, or a broken caching
    # strategy becomes unfixable for anyone who already loaded the page.
    <FilesMatch "^(sw\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # Nothing outside public/ is ever web-reachable.
    <DirectoryMatch "^/var/www/html/(src|bin|db|tests|storage|vendor|docker)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
