<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="robots" content="noindex">
<title>Siden findes ikke — Dansk idiomer</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#14171c; --muted:#6b7280; --line:#e0e4ea;
    --accent:#c8102e; --accent-ink:#fff; --shadow:0 1px 2px rgba(20,23,28,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#121419;--card:#1b1e24;--ink:#e8ebf0;--muted:#98a1b0;--line:#2b3039;
      --accent:#ff5a6e;--accent-ink:#1b1e24;--shadow:none;}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center}
  .wrap{max-width:38rem;width:100%;
    padding:1.25rem 1rem calc(2rem + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:1.75rem 1.5rem}
  .code{font-size:.85rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);margin:0 0 .5rem}
  h1{margin:0 0 .5rem;font-size:1.4rem;letter-spacing:-.02em}
  p{margin:0 0 1.25rem;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:.6rem}
  a.btn{display:inline-block;padding:.55rem .95rem;border-radius:9px;
    background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}
  a.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="code">404</p>
    <h1>Siden findes ikke</h1>
    <p>Adressen fører ingen steder hen. Måske er den skrevet forkert, eller også er linket forældet.</p>
    <div class="links">
      <a class="btn" href="/">Til forsiden</a>
      <a class="btn alt" href="/read">Læsning</a>
      <a class="btn alt" href="/proeve">Indfødsretsprøve</a>
    </div>
  </div>
</div>
</body>
</html>
