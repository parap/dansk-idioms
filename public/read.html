<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Læseforståelse</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#14171c; --muted:#6b7280; --line:#e0e4ea;
    --accent:#c8102e; --accent-ink:#fff; --ok:#127a4a; --okbg:#e7f6ee;
    --bad:#b3261e; --badbg:#fdecea; --chip:#eef1f5; --shadow:0 1px 2px rgba(20,23,28,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#121419;--card:#1b1e24;--ink:#e8ebf0;--muted:#98a1b0;--line:#2b3039;
      --accent:#ff5a6e;--accent-ink:#1b1e24;--ok:#4cc38a;--okbg:#14301f;
      --bad:#ff6b61;--badbg:#331b19;--chip:#232830;--shadow:none;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:-.02em;font-size:1.05rem;color:inherit;
    text-decoration:none;cursor:pointer}
  .brand:hover span{text-decoration:underline}
  .brand span{color:var(--accent)}
  header h1{font-size:1.3rem;margin:0}
  header .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .muted{color:var(--muted)}
  .lede{color:var(--muted);margin:.4rem 0 0}
  .grid{display:grid;gap:16px;grid-template-columns:1fr}
  @media (min-width:900px){ .grid{grid-template-columns:1.05fr .95fr;align-items:start}
    .grid .passage{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto} }
  .passage h2{font-size:1.05rem;margin:0 0 .6rem}
  .passage p{margin:0 0 .9rem;white-space:pre-wrap}
  .gap{display:inline-block;min-width:3.2rem;padding:0 .4rem;margin:0 .1rem;
    border:1px dashed var(--accent);border-radius:6px;background:var(--chip);
    color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;vertical-align:baseline}
  .gap.filled{border-style:solid;background:var(--card)}
  .gap[aria-current=true]{outline:2px solid var(--accent);outline-offset:1px}
  .item{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .item:first-child{border-top:none;padding-top:0;margin-top:0}
  .item h3{font-size:.9rem;margin:0 0 .5rem;color:var(--muted);font-weight:600}
  .item .prompt{margin:0 0 .6rem}
  .opts{display:grid;gap:8px}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .opt.chosen{background:var(--chip);border-color:var(--ink);font-weight:600}
  .primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
    padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
  .link{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
  .score{font-variant-numeric:tabular-nums;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* One tab per question, coloured by whether that question has an answer yet. */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .tab{min-width:2.4rem;padding:6px 4px;border-radius:8px;font:inherit;font-size:.95rem;
    font-weight:600;cursor:pointer;background:var(--badbg);color:var(--bad);
    border:1px solid var(--bad)}
  .tab.answered{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
  .tab.current{box-shadow:0 0 0 2px var(--ink)}
  .btn{padding:13px 20px;border-radius:10px;font:inherit;font-size:1.02rem;font-weight:600;
    cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .nav{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
  @media (max-width:520px){
    .tabs{gap:5px;margin-bottom:16px}
    .tab{min-width:2rem;padding:5px 3px;font-size:.85rem}
  }
  .lang{background:none;border:none;color:var(--muted);font:inherit;font-size:.85rem;
    padding:.2rem .35rem;cursor:pointer;border-radius:5px}
  .lang[aria-pressed=true]{color:var(--ink);font-weight:600;background:var(--chip)}
  .langs{display:inline-flex;gap:.1rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">Dansk <span>idiomer</span></a>
    <h1>Læseforståelse</h1>
    <span class="spacer"></span>
    <span id="left" class="score"></span>
    <span id="score" class="score muted"></span>
    <span id="langs" class="langs" hidden></span>
  </header>
  <div id="view"></div>
</div>

<script type="module">
import { $, esc, api, t, registerStrings, currentLang, setLang as applyLang } from '/shared.js';

// Interface strings. Adding a language means adding one key here; nothing else in the
// page hard-codes user-facing text.
const STRINGS = {
  ru: {
    prevQuestion: 'Назад', nextQuestion: 'Дальше',
    intro: 'Тренажёр по чтению для Prøve i Dansk 3. Прочитайте текст и ответьте на вопросы — ' +
           'формат тот же, что на экзамене.',
    start: 'Начать', startAgain: 'Ещё текст',
    cannotStart: 'Не удалось начать',
    questions: 'Вопросы', passage: 'Текст',
    gapHint: 'Нажмите на пропуск в тексте, чтобы перейти к вопросу.',
    right: 'Верно', wrong: 'Неверно',
    points: { one: 'балл', few: 'балла', many: 'баллов', other: 'баллов' },
    done: 'Раунд завершён.',
    report: 'Мой ответ тоже верный', reported: 'Спасибо — отправлено на проверку',
    modeDrill: 'Тренировка', modeExam: 'Экзамен',
    examBlurb: 'Полный вариант: три текста, 65 минут, результат в конце.',
    timeLeft: 'осталось', timeUp: 'Время вышло',
    submitExam: 'Сдать работу', confirmSubmit: 'Сдать? Изменить ответы будет нельзя.',
    unanswered: 'без ответа', karakter: 'оценка', indicative: 'ориентировочная',
    late: 'сдано после звонка', reviewAnswers: 'Разбор ответов',
  },
  en: {
    prevQuestion: 'Back', nextQuestion: 'Next',
    intro: 'Reading practice for Prøve i Dansk 3. Read the text and answer the questions — ' +
           'the format matches the exam.',
    start: 'Start', startAgain: 'Another text',
    cannotStart: 'Cannot start',
    questions: 'Questions', passage: 'Text',
    gapHint: 'Click a gap in the text to jump to its question.',
    right: 'Correct', wrong: 'Not right',
    points: { one: 'point', other: 'points' },
    done: 'Round complete.',
    report: 'My answer was also right', reported: 'Thanks — sent for review',
    modeDrill: 'Practice', modeExam: 'Exam',
    examBlurb: 'The full paper: three texts, 65 minutes, results at the end.',
    timeLeft: 'left', timeUp: 'Time is up',
    submitExam: 'Hand in', confirmSubmit: 'Hand in? Answers cannot be changed afterwards.',
    unanswered: 'unanswered', karakter: 'grade', indicative: 'indicative',
    late: 'handed in late', reviewAnswers: 'Review',
  },
  uk: {
    prevQuestion: 'Назад', nextQuestion: 'Далі',
    intro: 'Тренажер із читання для Prøve i Dansk 3. Прочитайте текст і дайте ' +
           'відповіді на запитання — формат той самий, що й на іспиті.',
    start: 'Почати', startAgain: 'Ще текст',
    cannotStart: 'Не вдалося почати',
    questions: 'Запитання', passage: 'Текст',
    gapHint: 'Натисніть на пропуск у тексті, щоб перейти до запитання.',
    right: 'Правильно', wrong: 'Неправильно',
    points: {one: 'бал', few: 'бали', many: 'балів', other: 'балів'},
    done: 'Раунд завершено.',
    report: 'Моя відповідь теж правильна',
    reported: 'Дякуємо — надіслано на перевірку',
    modeDrill: 'Тренування', modeExam: 'Іспит',
    examBlurb: 'Повний варіант: три тексти, 65 хвилин, результат наприкінці.',
    timeLeft: 'залишилось', timeUp: 'Час вийшов',
    submitExam: 'Здати роботу',
    confirmSubmit: 'Здати? Змінити відповіді буде неможливо.',
    unanswered: 'без відповіді',
    karakter: 'оцінка', indicative: 'орієнтовна',
    late: 'здано після дзвінка', reviewAnswers: 'Розбір відповідей',
  },
  da: {
    prevQuestion: 'Tilbage', nextQuestion: 'Næste',
    intro: 'Læsetræning til Prøve i Dansk 3. Læs teksten og svar på spørgsmålene — ' +
           'formatet er det samme som til prøven.',
    start: 'Start', startAgain: 'En tekst mere',
    cannotStart: 'Kunne ikke starte',
    questions: 'Spørgsmål', passage: 'Tekst',
    gapHint: 'Klik på et hul i teksten for at hoppe til spørgsmålet.',
    right: 'Rigtigt', wrong: 'Forkert',
    points: { one: 'point', other: 'point' },
    done: 'Runden er slut.',
    report: 'Mit svar var også rigtigt', reported: 'Tak — sendt til gennemsyn',
    modeDrill: 'Træning', modeExam: 'Prøve',
    examBlurb: 'Hele sættet: tre tekster, 65 minutter, resultat til sidst.',
    timeLeft: 'tilbage', timeUp: 'Tiden er gået',
    submitExam: 'Aflever', confirmSubmit: 'Aflever? Svarene kan ikke ændres bagefter.',
    unanswered: 'ubesvaret', karakter: 'karakter', indicative: 'vejledende',
    late: 'afleveret for sent', reviewAnswers: 'Gennemgang',
  },
};
registerStrings(STRINGS);

const view = $('#view');
let paper = null, scored = 0, ticker = null, current = null;

const isExam = () => paper?.mode === 'exam';

/**
 * The language switch. It is offered on the start screen only: changing language
 * rebuilds the screen, and rebuilding a round in progress would throw it away.
 */
function paintLanguages() {
  const box = $('#langs');
  box.hidden = false;
  box.innerHTML = Object.keys(STRINGS).map(code =>
    `<button class="lang" data-lang="${code}" aria-pressed="${code === currentLang()}"
      >${code.toUpperCase()}</button>`).join('');
  box.querySelectorAll('.lang').forEach(b => b.onclick = () => {
    applyLang(b.dataset.lang);
    home();
  });
}


function home() {
  stopClock();
  const left = $('#left'); if (left) left.textContent = '';
  document.removeEventListener('keydown', onKey);
  paintLanguages();
  view.innerHTML = `
    <div class="card">
      <p class="lede">${esc(t('intro'))}</p>
      <p class="row" style="margin-top:14px">
        <button class="primary" id="go">${esc(t('modeDrill'))}</button>
        <button class="primary" id="goExam" style="background:var(--chip);color:var(--ink)">${esc(t('modeExam'))}</button>
      </p>
      <p class="muted" style="font-size:.85rem;margin:0">${esc(t('examBlurb'))}</p>
    </div>`;
  $('#go').onclick = () => start('drill');
  $('#goExam').onclick = () => start('exam');
}

async function start(mode) {
  $('#go').disabled = $('#goExam').disabled = true;
  try {
    paper = await api('/reading/sessions', {method: 'POST', body: {mode}});
    scored = 0;
    render();
  } catch (e) {
    view.innerHTML = `<div class="card"><p><strong>${esc(t('cannotStart'))}</strong></p>
      <p class="muted">${esc(e.message)}</p></div>`;
  }
}

/**
 * The passage body is escaped BEFORE gap markers become buttons. Doing it the other way
 * round lets a passage author put markup on the page.
 */
function passageHtml(body) {
  return esc(body).replace(/\{\{(\d+)\}\}/g, (_, n) =>
    `<button class="gap" data-gap="${esc(n)}" id="gap-${esc(n)}">${esc(n)}</button>`);
}

function render() {
  $('#langs').hidden = true;
  document.addEventListener('keydown', onKey);
  view.innerHTML = `
    <div class="grid">
      <div id="texts"></div>
      <section class="card">
        <h2>${esc(t('questions'))}</h2>
        ${paper.items.length > 1 ? `<nav class="tabs" id="tabs">
          ${paper.items.map(i => `<button class="tab" data-pos="${i.position}">${i.position}</button>`).join('')}
        </nav>` : ''}
        <div id="items"></div>
        ${paper.items.length > 1 ? `<p class="nav">
          <button class="btn" id="prev">&larr; ${esc(t('prevQuestion'))}</button>
          <button class="btn" id="next">${esc(t('nextQuestion'))} &rarr;</button>
        </p>` : ''}
        ${isExam() ? `<p class="row" style="margin-top:16px">
            <button class="primary" id="hand">${esc(t('submitExam'))}</button></p>` : ''}
        <p class="row" style="margin-top:16px" id="foot" hidden>
          <button class="primary" id="again">${esc(t('startAgain'))}</button>
          <span class="muted">${esc(t('done'))}</span>
        </p>
      </section>
    </div>`;

  $('#texts').innerHTML = paper.passages.map((p, i) => `
    <section class="card passage" data-passage="${i}">
      <h2>${esc(p.title)}</h2>
      <p>${passageHtml(p.body)}</p>
      ${p.kind === 'mc' ? '' : `<p class="muted" style="font-size:.85rem">${esc(t('gapHint'))}</p>`}
    </section>`).join('');

  $('#items').innerHTML = paper.items.map(itemHtml).join('');
  paper.items.forEach(wire);
  view.querySelectorAll('.gap').forEach(g => {
    g.onclick = () => {
      showQuestion(Number(g.dataset.gap));
      view.querySelectorAll('.gap').forEach(o => o.setAttribute('aria-current', o === g));
    };
  });
  view.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => showQuestion(Number(t.dataset.pos));
  });
  if (paper.items.length > 1) {
    $('#prev').onclick = () => showQuestion(current - 1);
    $('#next').onclick = () => showQuestion(current + 1);
  }
  showQuestion(paper.items[0].position);

  if (isExam()) {
    $('#hand').onclick = hand;
    startClock();
  }
  updateScore();
}

/**
 * Opens one question, and with it the one text that question is about. Every question
 * stays in the document: an answer belongs to the paper, and a reader who turns back
 * must find their earlier answer where they left it.
 */
function showQuestion(position) {
  const positions = paper.items.map(i => i.position);
  const first = positions[0], last = positions[positions.length - 1];
  current = Math.min(Math.max(position, first), last);
  const passage = String(paper.items.find(i => i.position === current).passage ?? 0);

  view.querySelectorAll('.item').forEach(el => {
    el.hidden = Number(el.dataset.pos) !== current;
  });
  view.querySelectorAll('.passage').forEach(el => {
    el.hidden = el.dataset.passage !== passage;
  });
  view.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('current', Number(el.dataset.pos) === current);
  });
  if (paper.items.length > 1) {
    $('#prev').disabled = current === first;
    $('#next').disabled = current === last;
  }
}


function itemHtml(item) {
  const label = i => String.fromCharCode(65 + i);
  return `
    <div class="item" id="item-${item.position}" data-pos="${item.position}"
         data-passage="${item.passage ?? 0}">
      <h3>${item.position}. ${item.points} ${esc(t('points', item.points))}</h3>
      ${item.prompt ? `<p class="prompt">${esc(item.prompt)}</p>` : ''}
      <div class="opts">
        ${item.options.map(o => `
          <button class="opt" data-pos="${item.position}" data-index="${o.index}">
            <strong>${label(o.index)}.</strong> ${esc(o.text)}
          </button>`).join('')}
      </div>
      <p class="muted" id="fb-${item.position}" hidden></p>
    </div>`;
}

function wire(item) {
  view.querySelectorAll(`.opt[data-pos="${item.position}"]`).forEach(b => {
    b.onclick = () => answer(item, Number(b.dataset.index));
  });
}

const markAnswered = position =>
  view.querySelector(`.tab[data-pos="${position}"]`)?.classList.add('answered');


async function answer(item, chosen) {
  const buttons = [...view.querySelectorAll(`.opt[data-pos="${item.position}"]`)];
  if (!isExam()) buttons.forEach(b => b.disabled = true);

  let res;
  try {
    res = await api(`/reading/sessions/${paper.session_id}/answers`,
      {method: 'POST', body: {position: item.position, chosen_index: chosen, response_ms: 0}});
  } catch (e) {
    buttons.forEach(b => b.disabled = false);
    return false;
  }

  // An exam says nothing until the paper is handed in, so the page only records the
  // choice. Revealing anything here would be a different test from the real one.
  if (isExam()) {
    buttons.forEach(b => b.classList.remove('chosen'));
    buttons[chosen]?.classList.add('chosen');
    $(`#gap-${item.position}`)?.classList.add('filled');
    markAnswered(item.position);
    updateScore();
    return true;
  }

  buttons[chosen]?.classList.add(res.is_correct ? 'right' : 'wrong');
  if (!res.is_correct) buttons[res.correct_index]?.classList.add('right');

  const fb = $(`#fb-${item.position}`);
  fb.innerHTML = esc(res.is_correct ? t('right') : t('wrong'))
    + ` · <button class="link" id="rep-${item.position}">${esc(t('report'))}</button>`;
  fb.hidden = false;
  $(`#rep-${item.position}`).onclick = async (e) => {
    e.target.replaceWith(document.createTextNode(t('reported')));
    await api(`/reading/sessions/${paper.session_id}/items/${item.position}/report`,
      {method: 'POST', body: {reason: 'also_correct'}}).catch(() => {});
  };
  $(`#gap-${item.position}`)?.classList.add('filled');
  markAnswered(item.position);

  scored += res.points_scored;
  updateScore();

  if (view.querySelectorAll('.opt:not(:disabled)').length === 0) {
    $('#foot').hidden = false;
    $('#again').onclick = () => { home(); start('drill'); };
  }
  return true;
}


/**
 * The keyboard answers: 1/2/3 or A/B/C picks that option, and the arrows turn the page
 * without answering anything.
 *
 * The key is read as `event.code`, which names the physical key rather than the
 * character it produced, so a Cyrillic layout answers the same as a Latin one.
 *
 * Only an exam turns the page by itself. A drill answers back, and what it says is the
 * reason to be here -- turning away from it would take the answer off the screen in the
 * moment it appeared.
 */
function onKey(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const focused = document.activeElement?.tagName;
  if (focused === 'INPUT' || focused === 'SELECT' || focused === 'TEXTAREA') return;

  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault();
    showQuestion(current + (e.code === 'ArrowRight' ? 1 : -1));
    return;
  }

  const digit = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
  const letter = /^Key([A-Z])$/.exec(e.code);
  if (!digit && !letter) return;
  const index = digit ? Number(digit[1]) - 1 : letter[1].charCodeAt(0) - 65;

  const item = paper.items.find(i => i.position === current);
  if (!item || index >= item.options.length) return;
  const button = view.querySelectorAll(`.opt[data-pos="${current}"]`)[index];
  if (!button || button.disabled) return;
  e.preventDefault();
  answer(item, index).then(recorded => {
    if (recorded && isExam()) showQuestion(current + 1);
  });
}

async function hand() {
  const left = paper.items.length - view.querySelectorAll('.opt.right').length;
  if (!confirm(t('confirmSubmit'))) return;
  $('#hand').disabled = true;
  stopClock();
  await api(`/reading/sessions/${paper.session_id}/submit`, {method: 'POST'});
  results(await api(`/reading/sessions/${paper.session_id}/result`));
}

function results(r) {
  $('#langs').hidden = true;
  document.removeEventListener('keydown', onKey);
  const label = i => String.fromCharCode(65 + i);
  view.innerHTML = `
    <div class="card">
      <p class="score" id="final" style="font-size:1.4rem">${r.points_scored} / ${r.points_max}</p>
      <p><strong style="font-size:1.6rem">${esc(r.karakter)}</strong>
         <span class="muted">${esc(t('karakter'))} — ${esc(t('indicative'))}</span></p>
      ${r.is_late ? `<p class="muted">${esc(t('late'))}</p>` : ''}
      <p class="row"><button class="primary" id="again">${esc(t('startAgain'))}</button></p>
    </div>
    <div class="card">
      <h2>${esc(t('reviewAnswers'))}</h2>
      ${r.items.map(i => `
        <div class="item">
          <h3>${i.position}. ${i.points_scored} / ${i.points} ${esc(t('points', i.points))}</h3>
          ${i.prompt ? `<p class="prompt">${esc(i.prompt)}</p>` : ''}
          <div class="opts">
            ${i.options.map(o => `
              <div class="opt ${o.index === i.correct_index ? 'right' : (o.index === i.chosen_index ? 'wrong' : '')}">
                <strong>${label(o.index)}.</strong> ${esc(o.text)}
              </div>`).join('')}
          </div>
        </div>`).join('')}
    </div>`;
  $('#again').onclick = () => home();
}

// The countdown is decoration: the server decides what counts as late.
function startClock() {
  stopClock();
  let left = paper.remaining_s ?? 0;
  const paint = () => {
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const sec = String(left % 60).padStart(2, '0');
    const el = $('#left');
    if (el) el.textContent = `${m}:${sec} ${t('timeLeft')}`;
    if (el && left <= 300) el.style.color = 'var(--bad)';
  };
  paint();
  ticker = setInterval(() => {
    left = Math.max(0, left - 1);
    paint();
    if (left === 0) { stopClock(); hand(); }
  }, 1000);
}

function stopClock() {
  if (ticker) { clearInterval(ticker); ticker = null; }
}

function updateScore() {
  const answered = view.querySelectorAll('.opt.chosen, .opt.right, .opt.wrong').length;
  $('#score').textContent = isExam()
    ? `${answered} / ${paper.items.length}`
    : `${scored} / ${paper.points_max}`;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
home();
</script>
</body>
</html>
