<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Verber</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#14171c; --muted:#676e7b; --line:#e0e4ea;
    --accent:#c8102e; --accent-ink:#fff; --ok:#127a4a; --okbg:#e7f6ee;
    --bad:#b3261e; --badbg:#fdecea; --chip:#eef1f5; --shadow:0 1px 2px rgba(20,23,28,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#121419;--card:#1b1e24;--ink:#e8ebf0;--muted:#98a1b0;--line:#2b3039;
      --accent:#ff5a6e;--accent-ink:#1b1e24;--ok:#4cc38a;--okbg:#14301f;
      --bad:#ff6b61;--badbg:#331b19;--chip:#232830;--shadow:none;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:-.02em;font-size:1.05rem;color:inherit;
    text-decoration:none;cursor:pointer}
  .brand:hover span{text-decoration:underline}
  .brand span{color:var(--accent)}
  header h1{font-size:1.2rem;margin:0}
  .spacer{flex:1}
  .lang{background:none;border:none;color:var(--muted);font:inherit;font-size:.85rem;
    padding:.2rem .35rem;cursor:pointer;border-radius:5px}
  .lang[aria-pressed=true]{color:var(--ink);font-weight:600;background:var(--chip)}
  .langs{display:inline-flex;gap:.1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{font-size:1.05rem;margin:0 0 .6rem}
  .muted{color:var(--muted)}
  #sets{list-style:none;margin:0;padding:0;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr))}
  #sets a{display:grid;justify-items:center;gap:.1rem;height:100%;padding:.75rem .5rem;border-radius:12px;
    text-align:center;text-decoration:none;color:var(--ink);font-weight:600;
    background:hsl(var(--h) 85% 95%);border:1px solid hsl(var(--h) 55% 82%);transition:border-color .12s}
  #sets a:hover,#sets a:focus-visible{border-color:hsl(var(--h) 60% 45%)}
  /* A colour emoji font named outright: left to fallback, Linux draws some as black glyphs */
  #sets .pic{font:2.1rem/1.15 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  #sets .title{font-size:.95rem;white-space:nowrap}
  #sets .verb{font-size:.8rem;font-weight:500;font-style:italic;color:hsl(var(--h) 45% 30%)}
  #sets .n{display:block;color:var(--muted);font-size:.85rem;font-weight:400}
  @media (prefers-color-scheme:dark){
    #sets a{background:hsl(var(--h) 30% 19%);border-color:hsl(var(--h) 30% 32%)}
    #sets a:hover,#sets a:focus-visible{border-color:hsl(var(--h) 60% 60%)}
    #sets .verb{color:hsl(var(--h) 60% 78%)}
  }
  .q{margin:0 0 18px}
  .q:last-child{margin:0}
  .q p{margin:0 0 .45rem;font-weight:600}
  .opts{display:grid;gap:8px}
  .opt{display:block;width:100%;text-align:left;font:inherit;padding:.6rem .8rem;
    border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);
    cursor:pointer;min-height:44px}
  .opt:hover:not([disabled]){border-color:var(--accent)}
  .opt[disabled]{cursor:default}
  .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .q .note{margin:.55rem 0 0;font-size:.9rem;font-weight:400;line-height:1.55}
  .note b{font-weight:600}
  #score{font-weight:600}
  .tip{position:relative;top:-.2em;display:inline-block;vertical-align:middle}
  .info{width:24px;height:24px;margin:0 .1rem 0 .15rem;padding:0;border:none;background:none;
    cursor:pointer;color:var(--muted);font:italic 700 .75rem/1 Georgia,serif}
  .info::before{content:"i";display:inline-grid;place-items:center;width:16px;height:16px;
    border:1px solid currentColor;border-radius:50%}
  .info:hover,.info:focus-visible,.tip.open .info{color:var(--accent)}
  .tipbox{display:none;position:absolute;left:0;top:26px;z-index:5;width:max-content;
    max-width:min(17rem,70vw);padding:.45rem .6rem;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);box-shadow:0 4px 14px rgba(20,23,28,.12);
    font:400 .85rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .tip:hover .tipbox,.tip.open .tipbox{display:block}
  .cta{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
    padding:.85rem 1.1rem;border:1px solid var(--line);border-radius:10px;background:var(--chip);
    color:var(--ink);font-weight:600;text-decoration:none;transition:border-color .12s,background .12s}
  .cta:hover,.cta:focus-visible{border-color:var(--accent)}
  .cta b{color:var(--accent);font-size:1.15rem}
  .cta.back{display:inline-flex;justify-content:flex-start;margin:0 0 14px}
  .done{margin:.8rem 0 0}
  a{color:var(--accent)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">Dansk <span>idiomer</span></a>
    <h1 id="title"></h1>
    <span class="spacer"></span>
    <span id="langs" class="langs"></span>
  </header>
  <main id="view"></main>
</div>

<script type="module">
import { $, esc, t, api, registerStrings, currentLang, setLang as applyLang } from '/shared.js';

const STRINGS = {
  ru: {
    title: 'Глаголы',
    intro: '700 самых употребительных датских глаголов, по 25 в наборе, от частых к редким. Глагол показан в одной форме, спрашивается другая: navneform, nutid, datid, førnutid или bydeform. В «Genkend verbet» наоборот: по неправильной форме узнать глагол.',
    questions: {one: '{n} вопрос', few: '{n} вопроса', many: '{n} вопросов', other: '{n} вопроса'},
    empty: 'Наборов пока нет.',
    missing: 'Такого набора нет.',
    back: 'Все наборы',
    score: 'Верно',
    done: 'Все вопросы отвечены.',
    error: 'Не удалось загрузить. Попробуйте обновить страницу.',
    info: 'Пояснение',
    of: '{form} ({label}) глагола «{meaning}»',
    form_navneform: 'инфинитив, начальная форма глагола',
    form_nutid: 'настоящее время',
    form_datid: 'прошедшее время',
    form_førnutid: 'причастие для перфекта: har или er + эта форма',
    form_bydeform: 'повелительное наклонение',
  },
  en: {
    title: 'Verbs',
    intro: 'The 700 most frequent Danish verbs, 25 to a set, from common to rare. Each question shows a verb in one form and asks for another: navneform, nutid, datid, førnutid or bydeform. In “Genkend verbet” it is the other way round: name the verb an irregular form belongs to.',
    questions: {one: '{n} question', other: '{n} questions'},
    empty: 'No sets yet.',
    missing: 'There is no such set.',
    back: 'All sets',
    score: 'Correct',
    done: 'Every question is answered.',
    error: 'Could not load. Try reloading the page.',
    info: 'Explanation',
    of: '{form} ({label}) of the verb “{meaning}”',
    form_navneform: 'the infinitive, the verb’s base form',
    form_nutid: 'the present tense',
    form_datid: 'the past tense',
    form_førnutid: 'the participle of the perfect: har or er + this form',
    form_bydeform: 'the imperative',
  },
  uk: {
    title: 'Дієслова',
    intro: '700 найуживаніших данських дієслів, по 25 у наборі, від частих до рідших. Дієслово показано в одній формі, питають іншу: navneform, nutid, datid, førnutid або bydeform. У «Genkend verbet» навпаки: за неправильною формою впізнати дієслово.',
    questions: {one: '{n} питання', few: '{n} питання', many: '{n} питань', other: '{n} питання'},
    empty: 'Наборів поки немає.',
    missing: 'Такого набору немає.',
    back: 'Усі набори',
    score: 'Правильно',
    done: 'На всі питання дано відповідь.',
    error: 'Не вдалося завантажити. Спробуйте оновити сторінку.',
    info: 'Пояснення',
    of: '{form} ({label}) дієслова «{meaning}»',
    form_navneform: 'інфінітив, початкова форма дієслова',
    form_nutid: 'теперішній час',
    form_datid: 'минулий час',
    form_førnutid: 'дієприкметник для перфекта: har або er + ця форма',
    form_bydeform: 'наказовий спосіб',
  },
  da: {
    title: 'Verber',
    intro: 'De 700 mest brugte danske verber, 25 i hvert sæt, fra de hyppigste til de sjældnere. Hvert spørgsmål viser verbet i én form og spørger om en anden: navneform, nutid, datid, førnutid eller bydeform. I „Genkend verbet“ er det omvendt: find verbet til en uregelmæssig form.',
    questions: {one: '{n} spørgsmål', other: '{n} spørgsmål'},
    empty: 'Der er ingen sæt endnu.',
    missing: 'Det sæt findes ikke.',
    back: 'Alle sæt',
    score: 'Rigtige',
    done: 'Alle spørgsmål er besvaret.',
    error: 'Kunne ikke hente siden. Prøv at genindlæse den.',
    info: 'Forklaring',
    of: '{form} ({label}) af verbet «{meaning}»',
    form_navneform: 'verbets grundform (infinitiv)',
    form_nutid: 'præsens',
    form_datid: 'præteritum',
    form_førnutid: 'tillægsformen til førnutid: har eller er + denne form',
    form_bydeform: 'imperativ',
  },
};
registerStrings(STRINGS);

const slug = new URLSearchParams(location.search).get('s');
let sets = null;      // the list, once fetched
let round = null;     // the session for one set, once started
let missing = false;
let failed = false;
const marks = {};     // position -> {chosen, correct}

function paintLanguages() {
  const box = $('#langs');
  box.innerHTML = Object.keys(STRINGS).map(code =>
    `<button class="lang" data-lang="${code}" aria-pressed="${code === currentLang()}"
      >${code.toUpperCase()}</button>`).join('');
  box.querySelectorAll('.lang').forEach(b => b.onclick = () => { applyLang(b.dataset.lang); render(); });
}

// A picture of one verb from each set, and that verb under it.
const PICTURES = {
  'verbformer-001-025': ['✍️', 'skrive'], 'verbformer-026-050': ['🚗', 'køre'],
  'verbformer-051-075': ['📖', 'læse'], 'verbformer-076-100': ['🏗️', 'bygge'],
  'verbformer-101-125': ['🏃', 'løbe'], 'verbformer-126-150': ['🌧️', 'regne'],
  'verbformer-151-175': ['🍽️', 'spise'], 'verbformer-176-200': ['🎤', 'synge'],
  'verbformer-201-225': ['✏️', 'tegne'], 'verbformer-226-250': ['🐎', 'ride'],
  'verbformer-251-275': ['✈️', 'flyve'], 'verbformer-276-300': ['☕', 'drikke'],
  'verbformer-301-325': ['🎉', 'fejre'], 'verbformer-326-350': ['😴', 'sove'],
  'verbformer-351-375': ['⛵', 'sejle'], 'verbformer-376-400': ['😊', 'smile'],
  'verbformer-401-425': ['😋', 'smage'], 'verbformer-426-450': ['💃', 'danse'],
  'verbformer-451-475': ['🍳', 'koge'], 'verbformer-476-500': ['📦', 'pakke'],
  'verbformer-501-525': ['🌬️', 'blæse'], 'verbformer-526-550': ['💍', 'gifte'],
  'verbformer-551-575': ['🚲', 'cykle'], 'verbformer-576-600': ['⚽', 'sparke'],
  'verbformer-601-625': ['✂️', 'klippe'], 'verbformer-626-650': ['🅿️', 'parkere'],
  'verbformer-651-675': ['🌱', 'plante'], 'verbformer-676-700': ['🧼', 'vaske'],
};

function picture(slug) {
  if (PICTURES[slug]) return PICTURES[slug];
  return slug.startsWith('verbgenkend-') ? ['🔍', ''] : ['📘', ''];
}

function listView() {
  if (sets.length === 0) return `<div class="card"><p class="muted" style="margin:0">${esc(t('empty'))}</p></div>`;
  return `<div class="card">
      <p class="muted" style="margin:0 0 .9rem">${esc(t('intro'))}</p>
      <ul id="sets">
        ${sets.map((f, i) => {
          const [pic, verb] = picture(f.slug);
          // The golden angle keeps neighbouring sets far apart on the colour wheel.
          const hue = Math.round((i * 137.508) % 360);
          return `<li><a href="/verbs?s=${encodeURIComponent(f.slug)}" style="--h:${hue}">
            <span class="pic" aria-hidden="true">${pic}</span>
            <span class="title">${esc(f.title)}</span>
            ${verb ? `<span class="verb" lang="da">${esc(verb)}</span>` : ''}
            <span class="n">${esc(t('questions', f.questions).replace('{n}', f.questions))}</span>
          </a></li>`;
        }).join('')}
      </ul>
    </div>`;
}

// The two prompt shapes bin/verbs-generate.py writes; anything else is shown as it is.
const FORMS = 'navneform|nutid|datid|førnutid|bydeform';
const SHOWN_ASKED = new RegExp(`^(\\S+) \\((${FORMS})\\) — (.+)\\. (\\S+)\\?$`, 'u');
const RECOGNISE = new RegExp(`^(\\S+) — (${FORMS}) af …\\?$`, 'u');

function tip(id, text) {
  return `<span class="tip"><button type="button" class="info" aria-expanded="false" aria-controls="${id}"
    aria-label="${esc(t('info'))}"></button><span class="tipbox" role="tooltip" id="${id}">${esc(text)}</span></span>`;
}

// What a form is called, in the reader's language: "datid" is a term, not yet a word they know.
function formName(label) {
  return t('form_' + label.toLowerCase());
}

function promptHtml(item) {
  const da = s => `<span lang="da">${esc(s)}</span>`;
  const id = n => `tip-${item.position}-${n}`;
  let m = item.prompt.match(SHOWN_ASKED);
  if (m) {
    const [, form, label, meaning, asked] = m;
    const shown = t('of').replace('{form}', formName(label)).replace('{label}', label).replace('{meaning}', meaning);
    return `${da(form)}${tip(id(1), shown)} (${da(label)}) — ${esc(meaning)}. ${da(asked)}${tip(id(2), formName(asked))}?`;
  }
  m = item.prompt.match(RECOGNISE);
  if (m) {
    const [, form, label] = m;
    return `${da(form)} — ${da(label)}${tip(id(1), formName(label))} ${da('af …?')}`;
  }
  return esc(item.prompt);
}

function closeTips(except) {
  document.querySelectorAll('.tip.open').forEach(box => {
    if (box === except) return;
    box.classList.remove('open');
    box.querySelector('.info').setAttribute('aria-expanded', 'false');
  });
}

// A tip anchored near the right edge would run off a phone screen: shift it back inside.
function place(box) {
  const tipbox = box.querySelector('.tipbox');
  tipbox.style.left = '0';
  const overflow = tipbox.getBoundingClientRect().right - (document.documentElement.clientWidth - 8);
  if (overflow > 0) tipbox.style.left = `${-overflow}px`;
}

function wireTips(view) {
  view.querySelectorAll('.info').forEach(button => {
    const box = button.closest('.tip');
    box.onmouseenter = () => place(box);
    button.onclick = e => {
      e.stopPropagation();
      closeTips(box);
      const open = box.classList.toggle('open');
      button.setAttribute('aria-expanded', String(open));
      if (open) place(box);
      button.focus();
    };
    button.onkeydown = e => {
      if (e.key !== 'Escape') return;
      closeTips();
    };
  });
}
document.addEventListener('click', () => closeTips());

// "navneform være · nutid er … — быть": each form under its name, then the meaning.
function noteHtml(note) {
  const cut = note.indexOf(' — ');
  if (cut < 0) return `<p class="note">${esc(note)}</p>`;
  const forms = note.slice(0, cut).split(' · ').map(pair => {
    const sp = pair.indexOf(' ');
    return sp < 0 ? `<b>${esc(pair)}</b>`
      : `<span class="muted">${esc(pair.slice(0, sp))}</span> <b>${esc(pair.slice(sp + 1))}</b>`;
  }).join(' · ');
  return `<p class="note"><span lang="da">${forms}</span> — ${esc(note.slice(cut + 3))}</p>`;
}

function setView() {
  const set = round.passages[0];
  const right = Object.values(marks).filter(m => m.chosen === m.correct).length;
  const answered = Object.keys(marks).length;
  return `<a class="cta back" href="/verbs"><b aria-hidden="true">←</b><span>${esc(t('back'))}</span></a>
    <h2 style="margin:0 0 12px">${esc(set.title)}</h2>
    <div class="card">
      ${round.items.map(item => {
        const m = marks[item.position];
        return `<div class="q" data-pos="${item.position}">
          <p>${item.position}. ${promptHtml(item)}</p>
          <div class="opts" lang="da">${item.options.map(o => {
            const cls = !m ? '' : o.index === m.correct ? 'right' : o.index === m.chosen ? 'wrong' : '';
            return `<button class="opt ${cls}" data-i="${o.index}" ${m ? 'disabled' : ''}>${esc(o.text)}</button>`;
          }).join('')}</div>
          ${m && m.note ? noteHtml(m.note) : ''}
        </div>`;
      }).join('')}
      <p class="done"><span class="muted">${esc(t('score'))}:</span>
        <span id="score">${right} / ${round.items.length}</span></p>
      ${answered === round.items.length ? `<p class="muted" style="margin:.2rem 0 0">${esc(t('done'))}</p>` : ''}
    </div>`;
}

async function answer(position, chosen) {
  if (marks[position]) return;
  const r = await api(`/reading/sessions/${round.session_id}/answers`,
    {method: 'POST', body: {position, chosen_index: chosen}});
  marks[position] = {chosen, correct: r.correct_index, note: r.note};
  render();
  if (Object.keys(marks).length === round.items.length) {
    api(`/reading/sessions/${round.session_id}/submit`, {method: 'POST'}).catch(() => {});
  }
}

function render() {
  document.documentElement.lang = currentLang();
  $('#title').textContent = t('title');
  paintLanguages();

  const view = $('#view');
  if (failed) { view.innerHTML = `<div class="card"><p style="margin:0">${esc(t('error'))}</p></div>`; return; }
  if (missing) {
    view.innerHTML = `<div class="card" id="missing"><p style="margin:0 0 .6rem">${esc(t('missing'))}</p>
      <a class="cta back" href="/verbs"><b aria-hidden="true">←</b><span>${esc(t('back'))}</span></a></div>`;
    return;
  }
  if (slug === null && sets) { view.innerHTML = listView(); return; }
  if (slug !== null && round) {
    view.innerHTML = setView();
    wireTips(view);
    view.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () =>
      answer(Number(b.closest('.q').dataset.pos), Number(b.dataset.i)).catch(() => { failed = true; render(); }));
  }
}

async function load() {
  try {
    if (slug === null) sets = (await api('/verbs')).sets;
    else round = await api('/verbs/sessions', {method: 'POST', body: {slug}});
  } catch (e) {
    if (e.status === 404) missing = true; else failed = true;
  }
  render();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
render();
load();
</script>
</body>
</html>
