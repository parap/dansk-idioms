<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dansk.div</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9;
    color: #1a1c1f;
  }
  .card {
    max-width: 34rem;
    padding: 2.5rem;
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 .25rem; font-size: 1.9rem; letter-spacing: -.02em; }
  .sub { margin: 0 0 1.5rem; color: #6b7280; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; margin: 0; }
  dt { color: #6b7280; }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    body { background: #15171a; color: #e8eaed; }
    .card { background: #1d2024; border-color: #2c3036; }
    dt, .sub { color: #9aa1ab; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>dansk.div</h1>
    <p class="sub">Virtual host is up and serving.</p>
    <dl>
      <dt>Document root</dt><dd>/var/www/html/dansk.div</dd>
      <dt>Served by</dt><dd>Apache 2</dd>
      <dt>Host entry</dt><dd>127.0.0.1 dansk.div</dd>
    </dl>
  </main>
</body>
</html>
