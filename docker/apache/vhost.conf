# Two listeners, one application. Compose publishes 80 to the world and 81 to the
# loopback, and the admin surface answers through 81 alone -- see
# src/Support/AdminReach.php. The body both share lives in dansk-common.conf, so a rule
# added for visitors cannot be forgotten for the admin listener or the other way round.
Listen 81

<VirtualHost *:80>
    ServerName dansk.local
    DocumentRoot /var/www/html/public

    Include /etc/apache2/conf-available/dansk-common.conf

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:81>
    ServerName dansk-admin.local
    DocumentRoot /var/www/html/public

    # What makes this listener the admin one. A virtual host is chosen by the port the
    # connection actually arrived on, which no client can pick for itself.
    SetEnv DANSK_ADMIN_LISTENER 1

    Include /etc/apache2/conf-available/dansk-common.conf

    ErrorLog  ${APACHE_LOG_DIR}/admin-error.log
    CustomLog ${APACHE_LOG_DIR}/admin-access.log combined
</VirtualHost>
