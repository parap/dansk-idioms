services:
  app:
    build: .
    container_name: dansk_app
    ports:
      # Where a developer reaches the application directly. A deployment that terminates
      # TLS in front of it binds this to the loopback (APP_BIND=127.0.0.1:8080 in .env),
      # so the proxy holding the certificate is the only way in from outside.
      - "${APP_BIND:-8080}:80"
      # The admin surface, on the loopback only. Reach it with
      # ssh -L 8082:localhost:8082 <host> and open http://localhost:8082/admin.
      - "${ADMIN_BIND:-127.0.0.1:8082}:81"
    restart: unless-stopped
    networks:
      # Listed explicitly because naming any network switches off the implicit default,
      # and db and adminer are reached over that one.
      - default
      # Only this container joins the shared network. The database and Adminer stay off it,
      # so no other project on the host can reach them by name.
      - edge
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dansk
      DB_USER: dansk
      # No default: a working password in a committed file is a published credential the
      # moment the repository is. Set it in .env, which is gitignored.
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      APP_ENV: dev
      # No default and no value in this file. Unset, admin login refuses every attempt,
      # which is the right failure for a deployment nobody has given a password yet.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Unset. API errors and the health endpoint stay silent about internals unless a
      # developer deliberately turns this on, because this app is reachable publicly.
      APP_DEBUG: ${APP_DEBUG:-}
      # The publisher bot. Named here because this service has no env_file: a variable
      # that sits in .env and nowhere else never reaches the container, and the failure
      # is silent -- the webhook is delivered, the app answers 200, and nothing is
      # published. All four default to empty, which switches the bot off.
      BOT_COMMUNICATOR_TOKEN: ${BOT_COMMUNICATOR_TOKEN:-}
      BOT_COMMUNICATOR_SECRET: ${BOT_COMMUNICATOR_SECRET:-}
      BOT_COMMUNICATOR_OWNER: ${BOT_COMMUNICATOR_OWNER:-}
      BOT_COMMUNICATOR_GROUP: ${BOT_COMMUNICATOR_GROUP:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: dansk_db
    restart: unless-stopped
    # No host port published: the host already runs MySQL on 127.0.0.1:3306.
    # Uncomment to attach a GUI client on 3307 instead.
    # ports:
    #   - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: dansk
      MYSQL_USER: dansk
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - dbdata:/var/lib/mysql
      # Runs only on first initialisation of the volume; see README for an existing one.
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Reads the container's own environment rather than interpolating the secret into
      # this file. $$ escapes it from compose so the shell inside expands it.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: dansk_adminer
    ports:
      # Bound to the loopback, not to every interface: a published port bypasses the host
      # firewall entirely, because Docker writes its own rules into FORWARD and nat
      # PREROUTING rather than INPUT. Reach it with ssh -L 8081:localhost:8081.
      - "${ADMINER_BIND:-127.0.0.1:8081}:8080"
    restart: unless-stopped
    depends_on:
      - db

volumes:
  dbdata:

networks:
  # Where a deployment that terminates TLS reaches this application. The proxy holding the
  # certificate lives in its own compose project, so deploying this site never restarts the
  # entrance and never makes it re-read its certificate storage.
  #
  # External, and created by hand: no project owns it, so no project's `compose down` can
  # take it away from the others. A laptop needs it to exist before this file will start:
  #   docker network create edge
  edge:
    external: true
    name: edge
