<VirtualHost *:80>
    ServerName dansk.local
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Nothing outside public/ is ever web-reachable.
    <DirectoryMatch "^/var/www/html/(src|bin|db|tests|storage|vendor|docker)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
