version: '3.8'

services:
  app:
    build: .
    container_name: dansk_app
    ports:
      # Host Apache owns :80 and the host has no free :80 -- publish on 8080.
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dansk
      DB_USER: dansk
      DB_PASS: dansk
      APP_ENV: dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: dansk_db
    # No host port published: the host already runs MySQL on 127.0.0.1:3306.
    # Uncomment to attach a GUI client on 3307 instead.
    # ports:
    #   - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dansk
      MYSQL_USER: dansk
      MYSQL_PASSWORD: dansk
    volumes:
      - dbdata:/var/lib/mysql
      # Runs only on first initialisation of the volume; see README for an existing one.
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: dansk_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  dbdata:
