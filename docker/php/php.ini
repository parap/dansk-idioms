; The importer streams a Telegram export that can be hundreds of MB.
; These are generous because the container is ours, not shared hosting.
memory_limit = 512M
max_execution_time = 300
post_max_size = 512M
upload_max_filesize = 512M

default_charset = "UTF-8"

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
