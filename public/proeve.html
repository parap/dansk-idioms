<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Indfødsretsprøven</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#14171c; --muted:#6b7280; --line:#e0e4ea;
    --accent:#c8102e; --accent-ink:#fff; --ok:#127a4a; --okbg:#e7f6ee;
    --bad:#b3261e; --badbg:#fdecea; --chip:#eef1f5; --shadow:0 1px 2px rgba(20,23,28,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#121419;--card:#1b1e24;--ink:#e8ebf0;--muted:#98a1b0;--line:#2b3039;
      --accent:#ff5a6e;--accent-ink:#1b1e24;--ok:#4cc38a;--okbg:#14301f;
      --bad:#ff6b61;--badbg:#331b19;--chip:#232830;--shadow:none;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap;
    position:sticky;top:0;background:var(--bg);padding-top:8px;z-index:2}
  .brand{font-weight:700;letter-spacing:-.02em;font-size:1.05rem;color:inherit;
    text-decoration:none;cursor:pointer}
  .brand:hover span{text-decoration:underline}
  .brand span{color:var(--accent)}
  header h1{font-size:1.2rem;margin:0}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .muted{color:var(--muted)}
  .lede{color:var(--muted);margin:.4rem 0 0}
  .block{margin:22px 0 10px;font-size:.85rem;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted)}
  .item{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .item:first-child{border-top:none;padding-top:0;margin-top:0}
  .item h3{font-size:.95rem;margin:0 0 .6rem;color:var(--muted);font-weight:600}
  .item .prompt{margin:0 0 .9rem;font-size:1.25rem;line-height:1.45}
  .opts{display:grid;gap:8px}
  .opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt.chosen{background:var(--chip);border-color:var(--ink);font-weight:600}
  .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
    padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
  .primary:disabled{opacity:.45;cursor:default}
  /* Turning the page is done once per question; handing in happens once per paper, so
     the page-turns are the buttons that carry weight. */
  .btn{padding:13px 20px;border-radius:10px;font:inherit;font-size:1.05rem;font-weight:600;
    cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:default}
  .link{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
  .link:disabled{opacity:.4;cursor:default}
  .score{font-variant-numeric:tabular-nums;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);max-width:100%}
  label.check{display:flex;gap:8px;align-items:flex-start;margin-top:14px}
  .verdict{font-size:1.6rem;font-weight:700;margin:0 0 .3rem}
  .verdict.pass{color:var(--ok)} .verdict.fail{color:var(--bad)}
  .tally{display:grid;gap:4px;margin:10px 0 0;padding:0;list-style:none}
  .tally b{font-variant-numeric:tabular-nums}
  /* One tab per question, coloured by whether that question has an answer yet, so the
     paper can be read one question at a time without losing sight of what is left. */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
  .tab{min-width:2.4rem;padding:6px 4px;border-radius:8px;font:inherit;font-size:.95rem;
    font-weight:600;cursor:pointer;background:var(--badbg);color:var(--bad);
    border:1px solid var(--bad)}
  .tab.answered{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
  .tab.current{box-shadow:0 0 0 2px var(--ink)}
  /* Forty-five tabs at reading size fill a phone screen on their own, and the question
     they are there to reach ends up below the fold. */
  @media (max-width:520px){
    .tabs{gap:5px;margin-bottom:16px}
    .tab{min-width:2rem;padding:5px 3px;font-size:.85rem}
  }
  .nav{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
  .nav .spacer{min-width:16px}
  .lang{background:none;border:none;color:var(--muted);font:inherit;font-size:.85rem;
    padding:.2rem .35rem;cursor:pointer;border-radius:5px}
  .lang[aria-pressed=true]{color:var(--ink);font-weight:600;background:var(--chip)}
  .langs{display:inline-flex;gap:.1rem}
  /* One line per sitting already handed in. */
  .sitting{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
    border-top:1px solid var(--line);padding:10px 0;font-size:.98rem}
  .sitting:first-of-type{border-top:none}
  .sitting .name{flex:1;min-width:12ch}
  .sitting .when{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
  .sitting .tally{font-variant-numeric:tabular-nums;font-weight:600}
  .sitting .mark{font-weight:700}
  .sitting.pass .mark{color:var(--ok)}
  .sitting.fail .mark{color:var(--bad)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">Dansk <span>idiomer</span></a>
    <h1>Indfødsretsprøven</h1>
    <span class="spacer"></span>
    <span id="left" class="score"></span>
    <span id="score" class="score muted"></span>
    <button class="link" id="leave" hidden></button>
    <span id="langs" class="langs" hidden></span>

  <div id="history"></div>
</div>

<script type="module">

    withCurrentHint: 'De fem spørgsmål handler om månederne før den prøve. Uden dem er runden ' +
                     'kortere end prøven, så den bliver talt op, men ikke bedømt.',
    block_laeremateriale: 'Fra lærematerialet', block_aktuelle: 'Aktuelle spørgsmål',

    confirmSubmit: 'Aflever? Svarene kan ikke ændres bagefter.',

    partial_round: 'Det var en forkortet runde, og bestågrænsen gælder hele sættet.',
    no_pass_mark: 'Rettearket til dette sæt oplyser ingen bestågrænse.',
    correctOf: 'rigtige', valuesBlock: 'I værdiblokken', needed: 'kræver',

  },

registerStrings(STRINGS);

const view = $('#view');
let paper = null, ticker = null, current = null;

const label = i => String.fromCharCode(65 + i);
// One flat key per block: t() reads a non-string value as a plural map, so a nested
// object of block names would come back as whichever form Intl.PluralRules asked for.
const blockName = key => t('block_' + key);

/**
 * The language switch. It is offered on the start screen only: changing language
 * rebuilds the screen, and rebuilding a round in progress would throw it away.
 */
function paintLanguages() {
  const box = $('#langs');
  box.hidden = false;
  box.innerHTML = Object.keys(STRINGS).map(code =>
    `<button class="lang" data-lang="${code}" aria-pressed="${code === currentLang()}"
      >${code.toUpperCase()}</button>`).join('');
  box.querySelectorAll('.lang').forEach(b => b.onclick = () => {
    applyLang(b.dataset.lang);
    home();
  });
}


const whenText = stamp => String(stamp).replace('T', ' ').slice(0, 16);


/**
 * The sittings already handed in, newest first. Shown on the start screen, where the
 * question "what have I done, and am I getting better" is actually asked.
 *
 * Identity lives in the cookie, so this works without an account -- and registering
 * adopts what was sat before it.
 */
async function paintHistory(kinds, markup, mistakesKind) {
  const box = $('#history');
  box.innerHTML = '';
  let sessions = [], mistakes = {};
  try { ({sessions, mistakes} = await api('/reading/sessions')); } catch (e) { return; }

  const mine = sessions.filter(s => kinds.includes(s.kind));
  const waiting = mistakes?.[mistakesKind] ?? 0;
  if (!mine.length && !waiting) return;

  if (mine.length) {
    box.innerHTML = `<div class="card">
        <h2 style="margin:0 0 .4rem;font-size:1.05rem">${esc(t('history'))}</h2>
        ${mine.map(markup).join('')}
      </div>`;
  }
  if (!waiting) return;

  // Starting a round is an action, so it joins the other ways to start one rather than
  // sitting inside the record of what has already been sat.
  // Two paints can overlap -- switching language re-renders the screen while the first
  // request is still out -- and each would append its own copy.
  $('#mistakes')?.remove();

  const go = document.createElement('button');
  go.className = 'btn';
  go.id = 'mistakes';
  go.textContent = `${t('goOverMistakes')} (${waiting})`;
  go.onclick = async () => {
    go.disabled = true;
    try {
      paper = await api('/reading/mistakes', {method: 'POST', body: {kind: mistakesKind}});
      render();
    } catch (e) {
      go.disabled = false;
    }
  };
  $('#actions')?.append(go);
}


async function home() {
  stopClock();
  $('#left').textContent = '';
  $('#score').textContent = '';
  $('#leave').hidden = true;
  document.removeEventListener('keydown', onKey);
  paintLanguages();

  let papers = [];
  try {
    ({papers} = await api('/indfoedsret/papers'));
  } catch (e) {
    view.innerHTML = `<div class="card"><p><strong>${esc(t('cannotStart'))}</strong></p>
      <p class="muted">${esc(e.message)}</p></div>`;
    return;
  }

  // Newest first: the sitting a learner is preparing for is the one just held.
  papers = [...papers].reverse();

  view.innerHTML = `
    <div class="card">
      <p class="lede">${esc(t('intro'))}</p>
      <p class="row" style="margin-top:16px">
        <label for="paper">${esc(t('paper'))}</label>
        <select id="paper">
          ${papers.map(p => `<option value="${esc(p.slug)}">${esc(p.title)}</option>`).join('')}
        </select>
      </p>
      <p class="muted" id="about" style="font-size:.9rem;margin:.6rem 0 0"></p>
      <p style="margin:.6rem 0 0"><a class="link" href="/proeve/praktisk"
        >${esc(t('practical'))} →</a></p>
      <label class="check">
        <input type="checkbox" id="current" checked>
        <span>${esc(t('withCurrent'))}
          <span class="muted" style="display:block;font-size:.85rem">${esc(t('withCurrentHint'))}</span>
        </span>
      </label>
      <p class="row" id="actions" style="margin-top:16px">
        <button class="primary" id="go">${esc(t('start'))}</button>
      </p>
    </div>`;

  const describe = () => {
    const p = papers.find(x => x.slug === $('#paper').value);
    $('#about').textContent = p
      ? `${p.questions} ${t('questions')}` + (p.pass === null ? '' :
          ` · ${p.pass}/${p.questions} ${t('passMark')}` +
          (p.vaerdier_min === null ? '' : ` + ${p.vaerdier_min}/5 ${blockName('vaerdier').toLowerCase()}`))
      : '';
  };
  $('#paper').onchange = describe;
  describe();

  $('#go').onclick = () => start($('#paper').value, $('#current').checked);

  paintHistory(['quiz'], s => {
    const judged = s.verdict !== null;
    return `<div class="sitting ${judged ? (s.verdict === 'bestaaet' ? 'pass' : 'fail') : ''}">
      <span class="name">${esc(s.title)}</span>
      <span class="tally">${s.points_scored} / ${s.points_max}</span>
      <span class="mark">${esc(judged ? t(s.verdict) : t('noVerdict'))}</span>
      <span class="when">${esc(whenText(s.submitted_at))}</span>
    </div>`;
  }, 'quiz');
}

async function start(slug, currentAffairs) {
  $('#go').disabled = true;
  try {
    paper = await api('/indfoedsret/sessions',
      {method: 'POST', body: {slug, current_affairs: currentAffairs}});
    render();
  } catch (e) {
    view.innerHTML = `<div class="card"><p><strong>${esc(t('cannotStart'))}</strong></p>
      <p class="muted">${esc(e.message)}</p></div>`;
  }
}

function render() {
  const title = paper.passages[0]?.title ?? '';
  let block = null;

  view.innerHTML = `
    <section class="card">
      <h2 style="margin:0 0 .2rem;font-size:1.05rem">${esc(title)}</h2>
      <nav class="tabs" id="tabs">
        ${paper.items.map(i =>
          `<button class="tab" data-pos="${i.position}">${i.position}</button>`).join('')}
      </nav>
      <div id="items">
        ${paper.items.map(item => {
          const heading = item.section !== block
            ? `<p class="block" data-section="${esc(item.section)}">${esc(blockName(item.section))}</p>` : '';
          block = item.section;
          return heading + itemHtml(item);
        }).join('')}
      </div>
      <p class="nav">
        <button class="btn" id="prev">&larr; ${esc(t('prevQuestion'))}</button>
        <button class="btn" id="next">${esc(t('nextQuestion'))} &rarr;</button>
        <span class="spacer"></span>
        <span id="remaining" class="muted"></span>
        <button class="primary" id="hand">${esc(t('submitExam'))}</button>
      </p>
    </section>`;

  $('#langs').hidden = true;
  $('#history').innerHTML = '';
  document.addEventListener('keydown', onKey);
  paper.items.forEach(wire);
  view.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => showQuestion(Number(b.dataset.pos));
  });
  $('#prev').onclick = () => showQuestion(current - 1);
  $('#next').onclick = () => showQuestion(current + 1);
  $('#hand').onclick = () => hand();
  $('#leave').hidden = false;
  $('#leave').textContent = '← ' + t('leavePaper');
  $('#leave').onclick = leave;
  showQuestion(paper.items[0].position);
  if (paper.remaining_s) {
    startClock();
  } else {
    $('#left').textContent = '';
  }
  updateScore();
}

function itemHtml(item) {
  return `
    <div class="item" id="item-${item.position}" data-pos="${item.position}"
         data-section="${esc(item.section)}">
      <h3>${item.position}.</h3>
      <p class="prompt">${esc(item.prompt)}</p>
      <div class="opts">
        ${item.options.map(o => `
          <button class="opt" data-pos="${item.position}" data-index="${o.index}">
            <strong>${label(o.index)}.</strong> ${esc(o.text)}
          </button>`).join('')}
      </div>
    </div>`;
}

/**
 * Opens one question and closes the rest. Every question stays in the document, because
 * an answer belongs to the paper rather than to the page showing it, and a candidate who
 * goes back must find their earlier answer where they left it.
 */
function showQuestion(position) {
  const positions = paper.items.map(i => i.position);
  const first = positions[0], last = positions[positions.length - 1];
  current = Math.min(Math.max(position, first), last);
  const section = paper.items.find(i => i.position === current).section;

  view.querySelectorAll('.item').forEach(el => {
    el.hidden = Number(el.dataset.pos) !== current;
  });
  // A block heading belongs to its section, not to the question that happens to open it.
  view.querySelectorAll('.block').forEach(el => {
    el.hidden = el.dataset.section !== section;
  });
  view.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('current', Number(el.dataset.pos) === current);
  });
  $('#prev').disabled = current === first;
  $('#next').disabled = current === last;
}


function wire(item) {
  view.querySelectorAll(`.opt[data-pos="${item.position}"]`).forEach(b => {
    b.onclick = () => answer(item, Number(b.dataset.index));
  });
}

/**
 * The exam says nothing back until the paper is handed in, and an answer can be changed
 * until then. The page therefore records the choice and shows only that it was recorded.
 */
async function answer(item, chosen) {
  const buttons = [...view.querySelectorAll(`.opt[data-pos="${item.position}"]`)];
  try {
    await api(`/reading/sessions/${paper.session_id}/answers`,
      {method: 'POST', body: {position: item.position, chosen_index: chosen, response_ms: 0}});
  } catch (e) {
    return false;
  }

  buttons.forEach(b => b.classList.remove('chosen'));
  buttons.find(b => Number(b.dataset.index) === chosen)?.classList.add('chosen');
  view.querySelector(`.tab[data-pos="${item.position}"]`)?.classList.add('answered');
  updateScore();
  return true;
}


/**
 * The keyboard answers: 1/2/3 or A/B/C picks that option and turns the page.
 *
 * The key is read as `event.code`, which names the physical key rather than the
 * character it produced. A reader on a Cyrillic layout presses the key marked B and
 * types 'и'; reading the character would leave the letters dead for exactly the people
 * this page is written for.
 *
 * The page turns only once the answer is recorded, so a refused answer does not scroll
 * away out of sight. The arrows turn it without answering anything.
 */
function onKey(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const focused = document.activeElement?.tagName;
  if (focused === 'INPUT' || focused === 'SELECT' || focused === 'TEXTAREA') return;

  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault();
    showQuestion(current + (e.code === 'ArrowRight' ? 1 : -1));
    return;
  }

  const digit = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
  const letter = /^Key([A-Z])$/.exec(e.code);
  if (!digit && !letter) return;
  const index = digit ? Number(digit[1]) - 1 : letter[1].charCodeAt(0) - 65;

  const item = paper.items.find(i => i.position === current);
  if (!item || index >= item.options.length) return;
  e.preventDefault();
  answer(item, index).then(recorded => { if (recorded) showQuestion(current + 1); });
}

/** Leaves the paper unfinished. The round is not handed in, so it gets no verdict. */
function leave() {
  if (!confirm(t('confirmLeave'))) return;
  home();
}

/**
 * Ends the round. The clock hands in for a candidate who ran out of time, and asks
 * nothing, because there is nobody left to ask and no answer that would help.
 */
async function hand(ask = true) {
  if (ask && !confirm(t('confirmSubmit'))) return;
  $('#hand').disabled = true;
  stopClock();
  await api(`/reading/sessions/${paper.session_id}/submit`, {method: 'POST'});
  results(await api(`/reading/sessions/${paper.session_id}/result`));
}

function results(r) {
  const tally = r.tally ?? {};
  const passed = r.verdict === 'bestaaet';
  const headline = r.verdict ? t(r.verdict) : t('noVerdict');
  let block = null;

  // The clock is over, so it stops saying how long is left.
  $('#left').textContent = '';
  $('#score').textContent = '';
  $('#leave').hidden = true;
  $('#langs').hidden = true;
  $('#history').innerHTML = '';
  document.removeEventListener('keydown', onKey);
  view.innerHTML = `
    <div class="card">
      <p class="verdict ${r.verdict ? (passed ? 'pass' : 'fail') : ''}">${esc(headline)}</p>
      <ul class="tally">
        <li><b>${tally.correct ?? r.points_scored} / ${tally.questions ?? r.points_max}</b>
            ${esc(t('correctOf'))}${tally.pass == null ? '' :
              ` <span class="muted">(${esc(t('needed'))} ${tally.pass})</span>`}</li>
        ${tally.vaerdier_questions ? `<li>${esc(t('valuesBlock'))}:
            <b>${tally.vaerdier_correct} / ${tally.vaerdier_questions}</b>${tally.vaerdier_min == null ? '' :
              ` <span class="muted">(${esc(t('needed'))} ${tally.vaerdier_min})</span>`}</li>` : ''}
      </ul>
      ${tally.reason ? `<p class="muted">${esc(t(tally.reason))}</p>` : ''}
      ${r.is_late ? `<p class="muted">${esc(t('late'))}</p>` : ''}
      <p class="row" style="margin-top:14px"><button class="primary" id="again">${esc(t('startAgain'))}</button></p>
    </div>
    <div class="card">
      <h2 style="font-size:1.05rem;margin:0">${esc(t('reviewAnswers'))}</h2>
      ${r.items.map(i => {
        const heading = i.section !== block ? `<p class="block">${esc(blockName(i.section))}</p>` : '';
        block = i.section;
        return heading + `
        <div class="item">
          <h3>${i.position}.</h3>
          <p class="prompt">${esc(i.prompt)}</p>
          <div class="opts">
            ${i.options.map(o => `
              <div class="opt ${o.index === i.correct_index ? 'right' : (o.index === i.chosen_index ? 'wrong' : '')}">
                <strong>${label(o.index)}.</strong> ${esc(o.text)}
                ${o.index === i.chosen_index ? ` <span class="muted">— ${esc(t('yourAnswer'))}</span>` : ''}
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  $('#again').onclick = () => home();
}

// The countdown is decoration: the server decides what counts as late.
function startClock() {
  stopClock();
  let left = paper.remaining_s ?? 0;
  const paint = () => {
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const sec = String(left % 60).padStart(2, '0');
    const el = $('#left');
    el.textContent = `${m}:${sec} ${t('timeLeft')}`;
    if (left <= 300) el.style.color = 'var(--bad)';
  };
  paint();
  ticker = setInterval(() => {
    left = Math.max(0, left - 1);
    paint();
    if (left === 0) { stopClock(); hand(false); }
  }, 1000);
}

function stopClock() {
  if (ticker) { clearInterval(ticker); ticker = null; }
}

function updateScore() {
  const answered = view.querySelectorAll('.opt.chosen').length;
  const blank = paper.items.length - answered;
  $('#score').textContent = `${answered} / ${paper.items.length}`;

  // A paper is handed in once and a blank question can only be scored as wrong, so the
  // button that ends the round stays shut, and says what is holding it, until there is
  // nothing left unanswered. The clock is not bound by this: it ends the round itself.
  if ($('#hand')) $('#hand').disabled = blank > 0;
  if ($('#remaining')) $('#remaining').textContent = blank > 0 ? `${blank} ${t('unanswered')}` : '';
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
home();
</script>
</body>
</html>
